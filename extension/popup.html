<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { --pine:#0e5c48; --pine2:#0a4536; --ink:#1b1811; --soft:#514a3c; --faint:#8a8069; --line:#e3d9c4; }
    * { box-sizing: border-box; }
    body { width: 330px; margin: 0; font-family: system-ui, -apple-system, sans-serif; color: var(--ink); background: #fffdf7; }
    header { background: var(--pine); color: #fdfbf4; padding: 12px 14px; display: flex; align-items: center; gap: 9px; }
    header img { width: 22px; height: 22px; }
    header b { font-size: 14px; display: block; }
    header span { font-size: 10.5px; opacity: .85; }
    .body { padding: 14px; }
    label { display: block; font-size: 11px; font-weight: 600; color: var(--soft); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .04em; }
    input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; font: inherit; font-size: 13px; background: #fff; }
    button.primary { width: 100%; margin-top: 14px; padding: 10px; background: var(--pine); color: #fff; border: none; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
    button.primary:hover { background: var(--pine2); }
    button.primary:disabled { opacity: .6; cursor: default; }
    .link { background: none; border: none; color: var(--pine); font: inherit; font-size: 12px; cursor: pointer; padding: 0; text-decoration: underline; }
    .who { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--soft); }
    #status { margin-top: 12px; font-size: 12px; line-height: 1.5; min-height: 16px; }
    .ok { color: var(--pine); } .warn { color: #b87d00; } .err { color: #bd4a2c; }
    .hint { font-size: 10.5px; color: var(--faint); margin-top: 10px; line-height: 1.4; }
    details { margin-top: 12px; } summary { font-size: 11px; color: var(--faint); cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <img src="icons/48.png" alt="">
    <div><b>PathFinder Apply</b><span>you review &amp; submit · no auto-submit</span></div>
  </header>
  <div class="body" id="root"></div>
  <script src="popup.js"></script>
</body>
</html>
